background {
	monitor =
	path = $HOME/Pictures/Wallpapers/background.png
	blur_passes = 2
}

input-field {
	monitor =
	size = 200, 50
	placeholder_text = <i>Password</i>
	fail_text = <b>Attempt Failed</b>
	fade_on_empty = false
	outline_thickness = 3
	outer_color = rgba(0, 0, 0, 0)
	inner_color = rgba(100, 114, 125, 0.4)
	font_color = rgb(200, 200, 200)
	dots_size = 0.33
	dots_spacing = 0.15
	position = 0, -170
	halign = center
	valign = center
}

# user label

label {
	monitor =
	text = Pleased to meet you, $USER
	color = rgba(216, 222, 233, 0.7)
	font_size = 20
	font_family = Sf Pro Display Bold
	position = 0, -100
	halign = center
	valign = center
}

# usr icon

image {
	monitor =
	path = ~/.face
	border_color = 0xffdddddd
	border_size = 0
	size = 120
	rounding = -1
	rotate = 0
	reload_time = -1
	reload_cmd =
	position = 0, 20
	halign = center
	valign = center
}

# time

label {
	monitor =
	text = cmd[update:1000] echo $TIME
	color = rgba(216, 222, 233, 0.7)
	font_size = 200
	font_family = SF Pro Display Bold
	position = 0, 360
	halign = center
	valign = center
}

# D-M format date

label {
	monitor =
	text = cmd[] echo -e "$(date +"%A, %d, %B")"
	color = rgba(216, 222, 233, 0.7)
	font_size = 30
	font_family = SF Pro Display Bold
	position = 0, 165
	halign = center
	valign = center
}

# Spotify widget

# Spotify widget card background
shape {
    monitor = 
    size = 500, 120
    rounding = 15
    color = rgba(0, 0, 0, 0.1)
    border_size = 1
    border_color = rgba(255, 255, 255, 0.1)
    position = 0, -350
    halign = center
    valign = center
}

# Album Cover Art
image {
    monitor =
    path = /tmp/spotify_cover.png
    size = 90
    rounding = 8
    border_size = 0
    reload_time = 1
    reload_cmd = 
    onclick = ~/.config/hypr/scripts/spotify_info.sh --play-pause
    position = -185, -350
    halign = center
    valign = center
}

# Song Title
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/spotify_info.sh --title
    color = rgba(235, 237, 243, 1.0)
    font_size = 14
    font_family = SF Pro Display Bold
    position = 25, -325
    halign = center
    valign = center
}

# Artist Name
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/spotify_info.sh --artist
    color = rgba(216, 222, 233, 0.7)
    font_size = 12
    font_family = SF Pro Display
    position = 25, -345
    halign = center
    valign = center
}

# Progress Counter
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/spotify_info.sh --progress
    color = rgba(216, 222, 233, 0.6)
    font_size = 10
    font_family = SF Pro Display Monospaced
    position = 25, -362
    halign = center
    valign = center
}

# Previous Track Button
label {
    monitor =
    text = 󰒮
    color = rgba(216, 222, 233, 0.8)
    font_size = 14
    onclick = ~/.config/hypr/scripts/spotify_info.sh --previous
    position = -10, -385
    halign = center
    valign = center
}

# Play/Pause Button
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/spotify_info.sh --status-icon
    color = rgba(235, 237, 243, 1.0)
    font_size = 14
    onclick = ~/.config/hypr/scripts/spotify_info.sh --play-pause
    position = 25, -385
    halign = center
    valign = center
}

# Next Track Button
label {
    monitor =
    text = 󰒭
    color = rgba(216, 222, 233, 0.8)
    font_size = 14
    onclick = ~/.config/hypr/scripts/spotify_info.sh --next
    position = 55, -385
    halign = center
    valign = center
}
