# vim:ft=kitty
## name: Haimiya Light
## author: sky
## blurb: House palette - cream background, denim text, slate / sky /
##        periwinkle / peach accents (matches the nvim `haimiya` scheme).

# Basic colors
foreground           #2B4C6F
background           #F8FAF9
selection_foreground #2B4C6F
selection_background #A7B3EB

# Cursor colors
cursor            #2B4C6F
cursor_text_color #F8FAF9

# URL underline color when hovering with mouse
url_color #3E6FA8

# Window border colors and terminal bell colors
active_border_color   #A7CBEB
inactive_border_color #62829F
bell_border_color     #EBAA9D
visual_bell_color     none

# Tab bar colors
active_tab_foreground   #F8FAF9
active_tab_background   #2B4C6F
inactive_tab_foreground #2B4C6F
inactive_tab_background #F1F5F4
tab_bar_background      #F8FAF9
tab_bar_margin_color    none

# Mark colors (marked text in the terminal)
mark1_foreground #2B4C6F
mark1_background #A7B3EB
mark2_foreground #2B4C6F
mark2_background #EBAA9D
mark3_foreground #2B4C6F
mark3_background #A7CBEB

# The basic 16 colors
# black
color0 #1F3049
color8 #62829F

# red
color1 #A8454E
color9 #D06E78

# green
color2 #4E7D46
color10 #6A9A5E

# yellow
color3 #8A6D1A
color11 #B08A2E

# blue
color4 #3E6FA8
color12 #5B8FC7

# magenta
color5 #7E5A8C
color13 #9A72A8

# cyan
color6 #2F7C8A
color14 #4C9AA8

# white
color7 #E8EDF0
color15 #FFFFFF
