# vim:ft=kitty
## name: Haimiya Dark
## author: sky
## blurb: Deep denim background with the house accents and Nord syntax hues
##        (matches the nvim `haimiya-dark` scheme).

# Basic colors
foreground           #DCE6F2
background           #16212C
selection_foreground #DCE6F2
selection_background #274056

# Cursor colors
cursor            #DCE6F2
cursor_text_color #16212C

# URL underline color when hovering with mouse
url_color #88C0D0

# Window border colors and terminal bell colors
active_border_color   #A7CBEB
inactive_border_color #3A5068
bell_border_color     #EBAA9D
visual_bell_color     none

# Tab bar colors
active_tab_foreground   #16212C
active_tab_background   #A7CBEB
inactive_tab_foreground #DCE6F2
inactive_tab_background #1D2A36
tab_bar_background      #16212C
tab_bar_margin_color    none

# Mark colors (marked text in the terminal)
mark1_foreground #16212C
mark1_background #A7B3EB
mark2_foreground #16212C
mark2_background #EBAA9D
mark3_foreground #16212C
mark3_background #A7CBEB

